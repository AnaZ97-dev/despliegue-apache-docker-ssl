# VirtualHost por nombre
<VirtualHost *:80>
    ServerName www.empresa1.local
    ServerAlias empresa1.local
    DocumentRoot /usr/local/apache2/htdocs/empresa1/
</VirtualHost>

<VirtualHost *:80>
    ServerName www.empresa2.local
    ServerAlias empresa2.local
    DocumentRoot /usr/local/apache2/htdocs/empresa2/
</VirtualHost>

